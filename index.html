<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Todo List</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 30px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            min-width: 200px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover {
            background: #764ba2;
        }

        .todo-list {
            list-style: none;
        }

        .todo-item {
            background: #f9f9f9;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 4px solid #667eea;
            transition: all 0.3s;
        }

        .todo-item:hover {
            background: #f0f0f0;
            transform: translateX(5px);
        }

        .todo-item.completed {
            opacity: 0.6;
            border-left-color: #ccc;
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: #999;
        }

        .todo-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .todo-text {
            flex: 1;
            color: #333;
        }

        .todo-actions {
            display: flex;
            gap: 5px;
        }

        .btn-delete {
            background: #ff6b6b;
            padding: 5px 10px;
            font-size: 14px;
        }

        .btn-delete:hover {
            background: #ff5252;
        }

        .empty-message {
            text-align: center;
            color: #999;
            padding: 40px 20px;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Todo List</h1>
        
        <div class="input-group">
            <input 
                type="text" 
                id="todoInput" 
                placeholder="Add a new todo..."
                onkeypress="if(event.key === 'Enter') addTodo()"
            >
            <button onclick="addTodo()">Add</button>
        </div>

        <ul class="todo-list" id="todoList">
            <li class="loading">Loading todos...</li>
        </ul>
    </div>

    <script>
        // Load todos when page loads
        document.addEventListener('DOMContentLoaded', loadTodos);

        // LOAD - Fetch all todos
        async function loadTodos() {
            try {
                const response = await fetch('/api/todos');
                const todos = await response.json();
                
                const todoList = document.getElementById('todoList');
                todoList.innerHTML = '';
                
                if (todos.length === 0) {
                    todoList.innerHTML = '<li class="empty-message">No todos yet. Add one above!</li>';
                    return;
                }

                todos.forEach(todo => {
                    addTodoToDOM(todo);
                });
            } catch (error) {
                console.error('Error loading todos:', error);
                document.getElementById('todoList').innerHTML = 
                    '<li class="empty-message">Error loading todos</li>';
            }
        }

        // CREATE - Add a new todo
        async function addTodo() {
            const input = document.getElementById('todoInput');
            const title = input.value.trim();

            if (!title) {
                alert('Please enter a todo!');
                return;
            }

            try {
                const response = await fetch('/api/todos', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ title, description: '' })
                });

                if (response.ok) {
                    const newTodo = await response.json();
                    addTodoToDOM(newTodo);
                    input.value = '';
                    input.focus();
                } else {
                    alert('Error adding todo');
                }
            } catch (error) {
                console.error('Error adding todo:', error);
                alert('Error adding todo');
            }
        }

        // UPDATE - Toggle todo completion
        async function toggleTodo(id, completed) {
            try {
                const response = await fetch(`/api/todos/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ completed: !completed })
                });

                if (response.ok) {
                    loadTodos();
                }
            } catch (error) {
                console.error('Error updating todo:', error);
            }
        }

        // DELETE - Remove a todo
        async function deleteTodo(id) {
            if (confirm('Are you sure you want to delete this todo?')) {
                try {
                    const response = await fetch(`/api/todos/${id}`, {
                        method: 'DELETE'
                    });

                    if (response.ok) {
                        loadTodos();
                    }
                } catch (error) {
                    console.error('Error deleting todo:', error);
                }
            }
        }

        // Helper - Add todo item to DOM
        function addTodoToDOM(todo) {
            const todoList = document.getElementById('todoList');
            
            const li = document.createElement('li');
            li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
            li.innerHTML = `
                <input 
                    type="checkbox" 
                    class="todo-checkbox" 
                    ${todo.completed ? 'checked' : ''}
                    onchange="toggleTodo(${todo.id}, ${todo.completed})"
                >
                <span class="todo-text">${todo.title}</span>
                <div class="todo-actions">
                    <button class="btn-delete" onclick="deleteTodo(${todo.id})">Delete</button>
                </div>
            `;
            
            todoList.appendChild(li);
        }
    </script>
</body>
</html>
